name: Build and Upload Artifact

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Application Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate project directory
        id: locate
        run: |
          echo "Inspecting repository contents:"
          ls -la
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            PROJECT_DIR=$(dirname "$PKG_PATH")
            echo "Found package.json in directory: $PROJECT_DIR"
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: package.json was not found anywhere in the repository."
            echo "Listing full directory contents:"
            find . -maxdepth 3
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm install --legacy-peer-deps

      - name: Build artifact
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build-artifact
          path: ${{ steps.locate.outputs.project_dir }}/dist/
          retention-days: 14
